[package]
name = "wikigraph-frontend"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
eframe = "0.34.1"
egui = { version = "0.34.1", default-features = false }
egui_graphs = { version = "0.30.0", features = ["events"] }
petgraph = { version = "0.8.3", default-features = false }
wasm-bindgen = "0.2.118"
wasm-bindgen-futures = "0.4.68"
js-sys = "0.3.95"
web-sys = { version = "0.3.95", features = ["Window", "Document", "HtmlCanvasElement", "Request", "RequestInit", "RequestMode", "Response"] }
wikigraph-model = { path = "../model" }
serde_json = { version = "1.0.149", default-features = false, features = ["std"] }
rand = "0.9.4"
web-time = "1.1.0"

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }
