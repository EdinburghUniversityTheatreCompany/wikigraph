[package]
name = "wikigraph-model"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", default-features = false, features = ["std"] }
serde_derive = "1.0.228"
indexmap = { version = "2.14.0", features = ["serde"] }
jiff = { version = "0.2.35", default-features = false, features = ["serde"], optional = true }
petgraph = { version = "0.8.3", optional = true, features = ["rayon"] }
tracing = "0.1.44"
rayon = "1.12.0"

[features]
default = ["analysis", "manifest"]
analysis = ["dep:petgraph"]
manifest = ["dep:jiff"]
